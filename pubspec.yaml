name: pixel_tv_commander
description: "A custom Android TV companion app for managing local server stacks via Tailscale."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  path_provider: ^2.1.2
  open_filex: ^4.4.0
  xterm2: 5.0.0 # Pinned to the stable version compatible with Flutter 3.19.6
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
