name: Generate and Store Keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore Password (min 6 chars)'
        required: true
        type: string
      key_alias:
        description: 'Key Alias'
        required: true
        default: 'key'
        type: string
      key_password:
        description: 'Key Password (min 6 chars)'
        required: true
        type: string

jobs:
  generate-secrets:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Generate Keystore File
        run: |
          keytool -genkey -v \
            -keystore release-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ github.event.inputs.key_alias }}" \
            -passin pass:"${{ github.event.inputs.store_password }}" \
            -passout pass:"${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=PixelTV, OU=Dev, O=Home, L=Local, ST=State, C=US"

          # Convert keystore to base64 for safe storage in a secret
          BASE64_KEYSTORE=$(base64 -w 0 release-keystore.jks)

          echo "KEYSTORE_BASE64=$BASE64_KEYSTORE" >> $GITHUB_ENV

      - name: Push Secrets to GitHub Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          STORE_PASSWORD: ${{ github.event.inputs.store_password }}
          KEY_ALIAS: ${{ github.event.inputs.key_alias }}
          KEY_PASSWORD: ${{ github.event.inputs.key_password }}
        run: |
          # Use GitHub CLI to securely set repository secrets
          echo "$KEYSTORE_BASE64" | gh secret set SIGNING_KEYSTORE_BASE64 --repo "$REPOSITORY"
          echo "$STORE_PASSWORD" | gh secret set STORE_PASSWORD --repo "$REPOSITORY"
          echo "$KEY_ALIAS" | gh secret set KEY_ALIAS --repo "$REPOSITORY"
          echo "$KEY_PASSWORD" | gh secret set KEY_PASSWORD --repo "$REPOSITORY"
          
          echo "✅ Keystore generated and automatically pushed to repository secrets!"
